name: debug-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["debug_probe.py"]
concurrency:
  group: rtms-repo-push
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: |
          echo "=== run $GITHUB_RUN_ID $(date -u +%FT%TZ) ===" > data/debug_log.txt
          python -u debug_probe.py 2>&1 | tee -a data/debug_log.txt
      - name: Preserve collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/
            collect.log
          retention-days: 14
      - name: Commit & push
        if: always()
        run: |
          bash .github/scripts/push-data.sh "debug: collected $(date -u +%F)"
