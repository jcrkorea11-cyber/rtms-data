name: rone-rent-stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["rone.py", ".github/workflows/rone.yml"]
  schedule:
    - cron: "0 2 * * 1"   # 매주 월 11:00 KST (분기 통계라 주 1회면 충분)

concurrency:
  group: rtms-repo-push
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect R-ONE stats
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}
        run: |
          echo "=== run $GITHUB_RUN_ID $(date -u +%FT%TZ) ===" > data/rone_log.txt
          python -u rone.py 2>&1 | tee -a data/rone_log.txt
          echo "exit_code=${PIPESTATUS[0]}" >> data/rone_log.txt

      - name: Preserve collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rone-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/
            collect.log
          retention-days: 14
      - name: Commit & push
        if: always()
        run: |
          bash .github/scripts/push-data.sh "rone: collected $(date -u +%F)"
