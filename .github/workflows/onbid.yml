name: onbid-deal-flow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["onbid.py", ".github/workflows/onbid.yml"]
  schedule:
    - cron: "30 23 * * *"   # 매일 08:30 KST — 공매 물건 갱신

concurrency:
  group: rtms-repo-push
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect Onbid deals
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          echo "=== run $GITHUB_RUN_ID $(date -u +%FT%TZ) ===" > data/onbid_log.txt
          python -u onbid.py 2>&1 | tee -a data/onbid_log.txt
          echo "exit_code=${PIPESTATUS[0]}" >> data/onbid_log.txt

      - name: Preserve collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onbid-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/
            collect.log
          retention-days: 14
      - name: Commit & push
        if: always()
        run: |
          bash .github/scripts/push-data.sh "onbid: collected $(date -u +%F)"
